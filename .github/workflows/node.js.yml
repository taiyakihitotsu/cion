name: Node.js CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install TypeScript
        run: npm install

      - name: Run check
        run: npm run check

      - name: Run check:test
        run: npm run check:test

      - name: Build
        run: npm run build --if-present
